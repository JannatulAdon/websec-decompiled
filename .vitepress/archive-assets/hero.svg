<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 400" role="img" aria-label="Diagram: user input becomes query tokens; quote escapes the data channel">
  <defs>
    <linearGradient id="g" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#2dd4bf" stop-opacity="0.28"/>
      <stop offset="1" stop-color="#38bdf8" stop-opacity="0.04"/>
    </linearGradient>
    <linearGradient id="a" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#fbbf24"/>
      <stop offset="1" stop-color="#e879f9"/>
    </linearGradient>
    <filter id="glow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="6" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <rect x="20" y="20" width="480" height="360" rx="22" fill="url(#g)" stroke="#1e3a4a"/>

  <!-- input -->
  <text x="46" y="66" fill="#94a3b8" font-family="monospace" font-size="13">HTTP input</text>
  <rect x="46" y="80" width="196" height="46" rx="8" fill="#0b1120" stroke="#2dd4bf"/>
  <text x="60" y="109" fill="#5eead4" font-family="monospace" font-size="15">Gifts' UNION SELECT</text>

  <!-- parser -->
  <path d="M242 103h52" stroke="#2dd4bf" stroke-width="2" stroke-dasharray="4 4"/>
  <path d="M291 97l8 6-8 6" fill="none" stroke="#2dd4bf" stroke-width="2"/>

  <text x="316" y="66" fill="#94a3b8" font-family="monospace" font-size="13">tokenizer</text>
  <rect x="316" y="80" width="158" height="150" rx="10" fill="#08101c" stroke="#38bdf8"/>
  <text x="332" y="108" fill="#7dd3fc" font-family="monospace" font-size="13">string_literal</text>
  <text x="332" y="134" fill="#fbbf24" font-family="monospace" font-size="13">UNION</text>
  <text x="332" y="160" fill="#fbbf24" font-family="monospace" font-size="13">SELECT</text>
  <text x="332" y="186" fill="#e879f9" font-family="monospace" font-size="13">comment --</text>
  <text x="332" y="212" fill="#64748b" font-family="monospace" font-size="12">data | control</text>

  <!-- escape arrow -->
  <path d="M316 250 C 250 250, 220 290, 168 296" fill="none" stroke="url(#a)" stroke-width="3" filter="url(#glow)"/>
  <path d="M178 289l-12 7 10 8" fill="none" stroke="#e879f9" stroke-width="3"/>
  <text x="188" y="336" fill="#fbbf24" font-family="monospace" font-size="13">quote closes the literal</text>
  <text x="188" y="356" fill="#94a3b8" font-family="monospace" font-size="12">data becomes grammar</text>

  <!-- db -->
  <path d="M78 190v54c0 10 22 18 49 18s49-8 49-18v-54" fill="#08101c" stroke="#2dd4bf" stroke-width="2"/>
  <ellipse cx="127" cy="190" rx="49" ry="17" fill="#0f766e" fill-opacity="0.35" stroke="#2dd4bf" stroke-width="2"/>
  <text x="96" y="238" fill="#5eead4" font-family="monospace" font-size="13">parser</text>
  <text x="86" y="258" fill="#64748b" font-family="monospace" font-size="11">SELECT …</text>

  <circle cx="127" cy="150" r="3" fill="#2dd4bf"/>
  <text x="46" y="30" fill="#64748b" font-family="monospace" font-size="11">WEBSEC DECOMPILED / QUERY LIFECYCLE</text>
</svg>
